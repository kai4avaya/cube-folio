name: Sync GA4 Analytics Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GA4 Data API client
        run: pip install --no-cache-dir google-analytics-data

      - name: Sync GA4 metrics into analytics/data.json
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: "565841989"
        run: |
          if [ -z "$GA_SERVICE_ACCOUNT_JSON" ]; then
            echo "GA_SERVICE_ACCOUNT_JSON secret not set; skipping sync."
            exit 0
          fi
          python3 scripts/sync_analytics.py

      - name: Commit and publish to main & gh-pages
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GA_SERVICE_ACCOUNT_JSON" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync GA4 analytics data"
            git push origin HEAD:main
            git push origin HEAD:gh-pages
          fi
